# Basic vsftpd config suitable for evaluation / local use
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES
chroot_local_user=YES
allow_writeable_chroot=YES
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
# pasv_address can be set via env if needed; leave unset for local testing
# pasv_address=your.public.ip.or.hostname
seccomp_sandbox=NO

# Note: don't use logger_stdout (not supported by vsftpd); logs are available via `docker logs`.
