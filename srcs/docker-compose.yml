services:
  # 1. SERWIS MARIADB (Baza Danych)
  mariadb:
    build: 
      # Wskazuje na katalog, w którym znajduje się Dockerfile dla bazy danych
      context: ./requirements/mariadb 
    container_name: mariadb
    image: mariadb:1.0
    volumes:
      - /home/${USER}/data/mariadb:/var/lib/mysql
    env_file:
      - .env # Używa zmiennych środowiskowych (haseł, nazwy bazy) z pliku .env
    networks:
      - inception_network # Łączy się z siecią wewnętrzną
    restart: always # Kontener musi restartować po awarii
    healthcheck:
      # Używamy lokalnego socketu unixowego, ponieważ domyślna autoryzacja roota może wymagać unix_socket.
      # Ping przez socket działa wewnątrz kontenera i nie generuje 'unauthenticated' warnings.
      test: ["CMD-SHELL", "mysqladmin ping -S /run/mysqld/mysqld.sock --silent || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # 1.5 SERWIS REDIS (Bonus)
  redis:
    build:
      context: ./requirements/redis
    container_name: redis
    image: redis:1.0
    volumes:
      - /home/${USER}/data/redis:/data
    networks:
      - inception_network
    restart: always

  # Bonus: prosty serwis statyczny (nie-PHP)
  static_site:
    build:
      context: ./requirements/static_site
    container_name: static_site
    image: static_site:1.0
    ports:
      - "8080:80"
    networks:
      - inception_network
    restart: always

  # Bonus: Uptime / Health simple service (free-choice)
  uptime:
    build:
      context: ./requirements/uptime
    container_name: uptime
    image: uptime:1.0
    ports:
      - "8082:80"
    networks:
      - inception_network
    restart: unless-stopped

  # Bonus: Adminer (DB GUI)
  adminer:
    build:
      context: ./requirements/adminer
    container_name: adminer
    image: adminer:1.0
    ports:
      - "8081:80"
    networks:
      - inception_network
    restart: always

  # BONUS: FTP (simple vsftpd) — bind-mounted to host /home/${USER}/data/ftp
  ftp:
    build:
      context: ./requirements/ftp
    container_name: ftp
    image: ftp:1.0
    env_file:
      - .env
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    volumes:
      - /home/${USER}/data/ftp:/home/ftpusers
      # NOTE: do NOT mount the same host dir twice (would cause recursive copy)
    networks:
      - inception_network
    restart: always

  # 2. SERWIS WORDPRESS + PHP-FPM
  wordpress:
    build:
      # Wskazuje na katalog, w którym znajduje się Dockerfile dla WordPressa
      context: ./requirements/wordpress
      args:
        WORDPRESS_VERSION: ${WORDPRESS_VERSION:-}
    container_name: wordpress
    image: wordpress:1.0
    env_file:
      - .env
    volumes:
      - /home/${USER}/data/wordpress:/var/www/html
    networks:
      - inception_network 
    restart: always
    depends_on:
      - mariadb
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # 3. SERWIS NGINX (Reverse Proxy / Jedyny punkt wejścia)
  nginx:
    build: 
      # Wskazuje na katalog, w którym znajduje się Dockerfile dla NGINX
      context: ./requirements/nginx
    container_name: nginx
    image: nginx:1.0
    ports:
      # Wymagane: jedyne wejście do infrastruktury, tylko port 443 (HTTPS)
      - "443:443" 
    volumes:
      - /home/${USER}/data/wordpress:/var/www/html:ro
      - ./requirements/nginx/ssl:/etc/ssl/certs:ro
    networks:
      - inception_network
    restart: always
    env_file:
      - .env
    depends_on:
      - wordpress # Start wordpress przed nginx
      
# WOLUMENY (Dane powinny być przechowywane w /home/login/data/)
# Używamy bezpośrednich bind-mountów na hosta dla trwałych danych:
# - /home/${USER}/data/mariadb -> /var/lib/mysql
# - /home/${USER}/data/wordpress -> /var/www/html
# - /home/${USER}/data/redis -> /data

# SIEĆ DOCKER
networks:
  # Wymagana sieć typu bridge do komunikacji między kontenerami
  inception_network:
    driver: bridge


volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress

  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/redis

  ftp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/ftp

